name: Qualité du thème

# Style (CS-Fixer), analyse statique (PHPStan), tests unitaires PHP et tests JS.
# IMPORTANT : on ne vise QUE le thème (www/wp-content/themes/luziapi) et les
# tests de logique pure (tests/), jamais le cœur WordPress fourni par l'hôte.

on:
  push:
    branches: [main]
    paths:
      - "www/wp-content/themes/luziapi/**"
      - "tests/**"
      - "prod-mu-plugins/**"
      - "phpunit.xml.dist"
      - "composer.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "www/wp-content/themes/luziapi/**"
      - "tests/**"
      - "prod-mu-plugins/**"
      - "phpunit.xml.dist"
      - "composer.json"

jobs:
  quality:
    name: PHPStan + CS-Fixer (thème)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www/wp-content/themes/luziapi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: www/wp-content/themes/luziapi/vendor
          key: composer-${{ hashFiles('www/wp-content/themes/luziapi/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP-CS-Fixer (vérification du style)
        run: composer cs:check

      - name: PHPStan (analyse statique)
        run: composer stan

  tests-php:
    name: PHPUnit (logique pure)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install theme dependencies (autoload + Timber)
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: www/wp-content/themes/luziapi

      - name: Install test dependencies (PHPUnit)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: composer test

  tests-js:
    name: Tests JS (jsdom)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www/wp-content/themes/luziapi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dev dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test
